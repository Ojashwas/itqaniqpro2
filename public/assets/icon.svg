<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ITQAN IQ">
  <title>ITQAN IQ</title>
  <defs>
    <linearGradient id="iq-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a6149"/>
      <stop offset="1" stop-color="#07231c"/>
    </linearGradient>
    <linearGradient id="iq-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iq-green" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#63eab2"/>
      <stop offset=".45" stop-color="#15a873"/>
      <stop offset="1" stop-color="#096145"/>
    </linearGradient>
    <linearGradient id="iq-silver" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#c2d8cd"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#iq-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#iq-sheen)"/>

  <!-- extruded depth cast down-right -->
  <g fill="#041a13" opacity=".5">
    <circle cx="19.4" cy="18.4" r="3.5"/>
    <rect x="16.2" y="25.4" width="6.4" height="25" rx="3.2"/>
  </g>
  <g fill="none" stroke="#041a13" opacity=".45" stroke-linecap="round">
    <circle cx="37.4" cy="35.9" r="12" stroke-width="4.4"/>
    <path d="M46.9 45.4 51.9 50.4" stroke-width="5"/>
  </g>

  <!-- i -->
  <circle cx="18" cy="17" r="3.5" fill="url(#iq-silver)"/>
  <rect x="14.8" y="24" width="6.4" height="25" rx="3.2" fill="url(#iq-silver)"/>

  <!-- Q drawn as a magnifying glass -->
  <circle cx="36" cy="34.5" r="12" fill="none" stroke="url(#iq-green)" stroke-width="4.4"/>
  <path d="M45.5 44 50.5 49" fill="none" stroke="url(#iq-green)" stroke-width="5" stroke-linecap="round"/>
  <path d="M26.2 27.6A12 12 0 0 1 44.5 26" fill="none" stroke="#ccffe9" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ascending performance bars inside the lens -->
  <g fill="url(#iq-silver)">
    <rect x="30.2" y="35.2" width="3.4" height="5.8" rx="1.2"/>
    <rect x="34.5" y="31.6" width="3.4" height="9.4" rx="1.2"/>
    <rect x="38.8" y="28.2" width="3.4" height="12.8" rx="1.2"/>
  </g>
</svg>
